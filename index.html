<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/LogFilms.png">
    <title>LogFilms</title>
</head>
<body>
    <header>
        <h1>LogFilms</h1>
        <p class="error"></p>
        <div class="search-container">
            <button class="filterBtn" type="button">☰ Фільтри</button>
            <input class='search-input'type="text" placeholder="Введіть назву фільму">
            <button class="searchBtn">Знайти</button>

            <div class="filterPanel hidden">
                <div class="filter-group">
                    <label for="genreSelect">Жанр</label>
                    <select id="genreSelect" class="genre-select">
                        <option value="">Будь-який</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="yearSelect">Рік</label>
                    <select id="yearSelect" class="year-select">
                        <option value="">Будь-який</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="sortSelect">Сортування</label>
                    <select id="sortSelect" class="sort-select">
                        <option value="popularity.desc">За популярністю</option>
                        <option value="vote_average.desc">За рейтингом</option>
                        <option value="release_date.desc">Спочатку нові</option>
                        <option value="release_date.asc">Спочатку старі</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="applyFilterBtn">Застосувати</button>
                    <button class="resetFilterBtn">Скинути</button>
                </div>
            </div>
        </div>

        <div class="GolBtn-wrapper">
            <button class="GolBtn">Головна</button>
            <button class="OnBtn">Оновити</button>
        </div>
    </header>

    <button class="top-btn">🢁</button>
    
    <div class="Welcome">
        <h2 id="h2">Ласкаво просимо до LogFilms!</h2>
        <p id="p1">Знайдіть ваш улюблений фільм тут.</p>
    </div>

    <div class="recommend"></div>

    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="modalBody">

            </div>
        </div>
    </div>

    <footer>
        <p>Created by A and I studio</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
