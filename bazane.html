<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/LogFilms.png">
    <title>LogFilms — Бажане</title>
</head>
<body>
    <header>
        <h1>LogFilms</h1>
        <div class="search-container"></div>
        <div class="GolBtn-wrapper">
            <button class="homeBtn">На головну</button>
            <button class="LoginBtn" id="logoutBtn"></button>
        </div>
    </header>

    <div class="bazane">
        <h2 style="text-align: center; margin-top: 20px;">Бажані фільми</h2>
        <div class="recommend" id="wishlistContainer"></div>
    </div>

    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer>
        <p>Created by A and I studio</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('logfilms_current') || 'null');
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const logoutBtn = document.getElementById('logoutBtn');
            logoutBtn.textContent = 'Вийти (' + user.username + ')';
            logoutBtn.onclick = () => {
                localStorage.removeItem('logfilms_current');
                window.location.href = 'index.html';
            };

            document.querySelector('.homeBtn').onclick = () => {
                window.location.href = 'index.html';
            };

            window.renderWishlist = function() {
                const wishlistContainer = document.getElementById('wishlistContainer');
                if (!wishlistContainer) return;

                const uuid = user.uuid || user.id || user.username;
                const wishlist = JSON.parse(localStorage.getItem(`wishlist_${uuid}`) || '[]');

                if (wishlist.length === 0) {
                    wishlistContainer.innerHTML = `
                        <div class="not-found-container" style="text-align: center; margin-top: 40px;">
                            <p class="not-found">Ваш список бажаного порожній</p>
                            <p class="not-found">Додайте фільми з головної сторінки!</p>
                        </div>`;
                    return;
                }

                const IMAGE_URL = 'https://image.tmdb.org/t/p/w500';
                wishlistContainer.innerHTML = wishlist.map(movie => `
                    <div class="movie-card" data-movie='${JSON.stringify(movie).replace(/'/g, "&#39;")}'>
                        <img src="${movie.poster_path ? IMAGE_URL + movie.poster_path : 'placeholder.jpg'}" alt="${movie.title || movie.original_title}">
                        <h3 id="h31">${movie.title || movie.original_title}</h3>
                        <p id="p2">Рік: ${movie.release_date ? movie.release_date.split('-')[0] : 'Невідомо'}</p>
                        <p id="p2">Оцінка: ${movie.vote_average ? movie.vote_average.toFixed(1) : 'Немає'}</p>
                    </div>
                `).join('');

                wishlistContainer.querySelectorAll('.movie-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const movieData = JSON.parse(this.dataset.movie);
                        if (typeof openMovieModal === 'function') {
                            openMovieModal(movieData);
                        }
                    });
                });
            };

            window.renderWishlist();
        });
    </script>
</body>
</html>
